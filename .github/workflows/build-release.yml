name: Test and build — no mining in CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: Linux-x64
            exe: CPUTipJar
          - os: windows-2022
            artifact: Windows-x64
            exe: CPUTipJar.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run harmless unit tests
        run: python -m unittest discover -s tests -v
      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0
      - name: Package standalone app
        run: python -m PyInstaller --clean --onefile --windowed --name CPUTipJar launcher.py
      - name: Executable self-test — does not mine
        run: ./dist/${{ matrix.exe }} --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: CPUTipJar-${{ matrix.artifact }}
          path: dist/${{ matrix.exe }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CPUTipJar-Linux-x64
          path: release/linux
      - uses: actions/download-artifact@v4
        with:
          name: CPUTipJar-Windows-x64
          path: release/windows
      - name: Create signed-by-checksum download archives
        run: |
          chmod +x release/linux/CPUTipJar
          tar -czf CPUTipJar-Linux-x64.tar.gz -C release/linux CPUTipJar
          (cd release/windows && zip -q ../../CPUTipJar-Windows-x64.zip CPUTipJar.exe)
          sha256sum CPUTipJar-Linux-x64.tar.gz CPUTipJar-Windows-x64.zip > SHA256SUMS
      - name: Publish preview release (no code executed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" CPUTipJar-Linux-x64.tar.gz CPUTipJar-Windows-x64.zip SHA256SUMS --repo "${GITHUB_REPOSITORY}" --title "CPU Tip Jar ${GITHUB_REF_NAME} — preview" --notes "Small opt-in donation miner with a refreshed one-window interface and crash-stop safeguards. Automated tests run without mining. An isolated Linux pool-share test passed on the underlying code; complete graphical desktop testing and Windows GUI/Defender checks remain outstanding. Read README and docs/SAFETY.md before using this preview." --prerelease
